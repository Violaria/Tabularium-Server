<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Tabularium</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <div class="login-page">
    <div class="login-box">
      <div class="brand"><span class="brand-mark">T</span><div><strong>Tabularium</strong><small>加密笔记同步服务器</small></div></div>
      <a class="card entry" href="/admin/"><h2>管理控制台</h2><p>账户、笔记库、同步设备与服务器状态。</p></a>
      <div class="card entry off"><h2>云笔记 <span class="badge off">规划中</span></h2><p>在浏览器中查看和编辑笔记。</p></div>
      <div class="card entry off"><h2>AI 对话 <span class="badge off">规划中</span></h2><p>检索、问答与整理笔记。</p></div>
      <small>同步地址为 <span class="mono">/sync</span>，在 Obsidian 的 Tabularium 插件中登录本服务器即可。</small>
    </div>
  </div>
</body>
</html>
